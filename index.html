<!doctype html>
<html lang="en">
<!--
  ════════════════════════════════════════════════════════════════
  THE JOURNEY - personal site (Himalayas → Kathmandu → Toronto)
  ════════════════════════════════════════════════════════════════
  HOW TO EDIT (humans + AI models):

  1. CONFIG (top of the main <script>) is the SINGLE SOURCE OF
     TRUTH: all text, nav, photos, about content, globe cities,
     asset paths and scene palettes. Look for ✏️ EDIT markers.
     Never duplicate copy in HTML - injected fields are empty tags.

  2. ASSETS: every path in CONFIG can be a remote URL or a local
     /assets/... file. Remote URLs shipped here are TEMPORARY CC0/
     public-domain placeholders - self-host them later. Every image
     has a graceful fallback chain (alt URL → generated art), and
     GSAP/Lenis/Three.js failures degrade to a readable static page.

  3. CHAPTERS: each journey beat has its own storytelling device
     (hero rig, photo window, pinned zoom, horizontal pan, globe).
     Chapter text lives in CONFIG.chapters (label + lead + passage);
     the markup slots are data-ch-lead / data-ch-passage. To add a
     plain section (Projects, Resume…): copy a window chapter block,
     give it an id, add ONE entry to CONFIG.nav + CONFIG.sceneMap.

  4. SCENES: the fixed background (WebGL clouds on desktop, CSS
     gradient on mobile/low-power) is graded by scroll through
     CONFIG.scenes + CONFIG.sceneMap. Each scene also sets cloud
     CHARACTER: wisp (1 thin cirrus … 0 big billows) and stars (0..1
     star field - the globe band is real space). Chapter boundaries
     get automatic palette-tinted "cloud gate" decks you descend
     through (see GATES in the script); <div class="breath"> spacers
     between chapters give the descent its pacing.

  5. HERO: CONFIG.heroLayers = dimensional parallax rig (photo peak,
     cloud planes, foreground ridge, live snow) that tilts toward the
     cursor. Give each layer a src to use your own transparent PNGs;
     leave src:"" for the built-in generated layers. type:"cloud"
     = soft plane, type:"ridge" = smooth dark silhouette.
  ════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- ✏️ EDIT meta (also mirrored in CONFIG.meta for JS use) -->
<title>The Journey, Himalayas to Toronto | Personal Site</title>
<meta name="description" content="A cinematic scroll story and personal site: from the Himalayas to Kathmandu to Toronto. Student, builder, photographer." />
<meta name="theme-color" content="#3a5a73" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='8' width='16' height='16' fill='none' stroke='%23eef4f6' stroke-width='2' transform='rotate(45 16 16)'/%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:title" content="The Journey, Himalayas to Toronto" />
<meta property="og:description" content="A cinematic scroll story and personal site: mountains, temples, flight, and a new skyline." />
<meta property="og:image" content="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&q=70" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --steel:#35638a;--steel-2:#5b83a4;--steel-soft:#86a5be;
  --fog:#eef4f6;--fog-70:rgba(238,244,246,.78);--fog-50:rgba(238,244,246,.55);
  --line-w:rgba(255,255,255,.35);
  --gutter:clamp(1.4rem,6vw,7rem);
  --font:"Jost","Century Gothic",Futura,system-ui,sans-serif;
  --ease:cubic-bezier(.55,.08,.14,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{background:#5b7183;color:var(--fog);font-family:var(--font);font-weight:300;
  font-size:clamp(15px,1.1vw,18px);line-height:1.9;letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--steel);color:#fff}
a{color:inherit;text-decoration:none}
img,svg,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:2px}
[id]{scroll-margin-top:76px}

/* ---------- fixed atmosphere ---------- */
.sky,.dust{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.dust{z-index:1}
/* cloud-gate layer: decks you pass through at chapter boundaries - sits OVER content */
.gates{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.atmosphere{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
.atmosphere img{position:absolute;width:132%;left:-16%;height:auto;will-change:transform}
.sky-fallback{position:fixed;inset:0;z-index:0;pointer-events:none;display:none;
  background:linear-gradient(180deg,#8fa3ad,#4c6273 55%,#41586a)}
.no-webgl .sky-fallback{display:block}
.no-webgl .sky{display:none}
.page{position:relative;z-index:2}

/* ---------- type ---------- */
.h-big{text-transform:uppercase;font-weight:300;color:var(--fog);letter-spacing:.10em;
  line-height:1.3;font-size:clamp(1.6rem,4vw,3.2rem);text-shadow:0 1px 24px rgba(20,35,45,.35)}
.eyebrow{text-transform:uppercase;letter-spacing:.34em;font-size:.7rem;font-weight:400;color:var(--fog-70)}
p.body{max-width:56ch;color:var(--fog-70);font-weight:300}
.char{display:inline-block;white-space:pre}
.diamond{position:relative;width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center}
.diamond::before{content:"";position:absolute;inset:6px;border:1px solid var(--line-w);transform:rotate(45deg);transition:transform 1s var(--ease)}
.diamond span{font-size:.8rem;font-weight:400;color:var(--fog)}
.diamond:hover::before{transform:rotate(135deg)}
.cta-circle{display:inline-flex;flex-direction:column;gap:1rem;width:fit-content}
.cta-circle .cc-row{display:inline-flex;align-items:center;gap:1.2rem}
.cta-circle .cc-label{text-transform:uppercase;letter-spacing:.3em;font-size:.72rem;font-weight:500;color:var(--fog)}
.cta-circle .cc-ring{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);
  display:flex;align-items:center;justify-content:center;flex:none;transition:transform .5s var(--ease)}
.cta-circle .cc-ring svg{width:16px;height:16px;transition:transform .45s var(--ease)}
.cta-circle .cc-ring svg path{stroke:var(--steel);stroke-width:1.6;fill:none}
.cta-circle:hover .cc-ring{transform:scale(1.12)}
.cta-circle:hover .cc-ring svg{transform:translateX(3px)}
.cta-circle .cc-line{height:1px;width:min(220px,40vw);background:var(--line-w);transform-origin:left;transition:transform .7s var(--ease)}
.cta-circle:hover .cc-line{transform:scaleX(1.25)}

/* ---------- preloader ---------- */
.preloader{position:fixed;inset:0;z-index:3000;background:linear-gradient(180deg,#7e94a0,#54697a 60%,#41586a);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.6rem}
.preloader .diamond{width:64px;height:64px}
.preloader .diamond::before{border-color:rgba(255,255,255,.7)}
.pl-word{display:flex;gap:.42em;text-transform:uppercase;font-weight:300;
  font-size:clamp(1.3rem,3.4vw,2rem);letter-spacing:.2em;color:#fff}
.pl-word span{opacity:0}
.pl-sub{text-transform:uppercase;letter-spacing:.4em;font-size:.62rem;color:rgba(255,255,255,.65);opacity:0}

/* ---------- header / menu ---------- */
.site-header{position:fixed;top:0;left:0;right:0;z-index:1001;display:flex;align-items:center;gap:3rem;
  padding:1.5rem var(--gutter);transition:transform .6s var(--ease),background .5s,padding .5s}
.site-header.is-solid{background:linear-gradient(180deg,rgba(30,42,52,.72),rgba(30,42,52,0));backdrop-filter:blur(8px);padding:1rem var(--gutter)}
.site-header.is-hidden{transform:translateY(-110%)}
.brand{display:flex;align-items:center;gap:.9rem}
.brand .diamond{width:34px;height:34px}
.brand .diamond::before{inset:3px}
.brand .diamond i{position:absolute;inset:13px;background:#fff;transform:rotate(45deg)}
.brand-name{text-transform:uppercase;font-weight:400;letter-spacing:.42em;font-size:.95rem;color:#fff}
.main-nav{display:none;gap:2.4rem;margin-left:1rem}
@media(min-width:820px){.main-nav{display:flex}}
.main-nav a{text-transform:uppercase;font-size:.66rem;letter-spacing:.24em;font-weight:400;color:var(--fog-70);
  position:relative;padding:.3rem 0;transition:color .35s}
.main-nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:#fff;
  transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.main-nav a:hover,.main-nav a.is-current{color:#fff}
.main-nav a:hover::after,.main-nav a.is-current::after{transform:scaleX(1);transform-origin:left}
.header-right{margin-left:auto;display:flex;align-items:center;gap:2rem}
.menu-toggle{display:flex;align-items:center;gap:.9rem}
.menu-toggle .mt-label{text-transform:uppercase;font-size:.66rem;letter-spacing:.3em;color:#fff}
.menu-toggle .mt-icon{width:26px;height:11px;position:relative}
.menu-toggle .mt-icon i{position:absolute;left:0;right:0;height:1px;background:#fff;transition:transform .5s var(--ease),top .5s var(--ease),width .4s}
.menu-toggle .mt-icon i:first-child{top:0}
.menu-toggle .mt-icon i:last-child{top:9px;width:70%}
.menu-toggle:hover .mt-icon i:last-child{width:100%}
.menu-open .menu-toggle .mt-icon i:first-child{top:4.5px;transform:rotate(45deg)}
.menu-open .menu-toggle .mt-icon i:last-child{top:4.5px;width:100%;transform:rotate(-45deg)}
.menu-overlay{position:fixed;inset:0;z-index:1000;visibility:hidden;
  background:linear-gradient(200deg,rgba(52,72,88,.94),rgba(28,44,56,.96));backdrop-filter:blur(18px);
  clip-path:inset(0 0 100% 0);display:flex;flex-direction:column;justify-content:center;padding:6rem var(--gutter) 3rem}
.menu-nav{display:flex;flex-direction:column;gap:.2rem}
.menu-link{display:flex;align-items:baseline;gap:1.6rem;width:fit-content;padding:.35rem 0}
.menu-link .ml-num{font-size:.68rem;letter-spacing:.2em;color:var(--fog-50)}
.menu-link .ml-text{display:inline-block;text-transform:uppercase;font-weight:200;
  font-size:clamp(1.9rem,6vw,4.2rem);letter-spacing:.14em;line-height:1.15;color:var(--fog);
  transition:letter-spacing .6s var(--ease),color .4s}
.menu-link:hover .ml-text{letter-spacing:.22em;color:#fff}
.menu-foot{margin-top:4rem;display:flex;justify-content:space-between;gap:2rem;flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.18);padding-top:1.5rem;
  text-transform:uppercase;font-size:.62rem;letter-spacing:.26em;color:var(--fog-50)}

/* ---------- side ui + journey dots ---------- */
.side-ui{position:fixed;right:clamp(1rem,3vw,2.6rem);bottom:clamp(1.2rem,4vh,2.6rem);z-index:800;
  display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.to-top{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;transition:background .4s;opacity:0;pointer-events:none}
.to-top.is-on{opacity:1;pointer-events:auto}
.to-top:hover{background:rgba(255,255,255,.9)}
.to-top svg path{stroke:#fff;stroke-width:1.4;fill:none;transition:stroke .3s}
.to-top:hover svg path{stroke:var(--steel)}
.progress-dash{width:22px;height:1px;background:rgba(255,255,255,.6);transform-origin:left}
.journey-dots{position:fixed;left:clamp(.7rem,2vw,1.8rem);top:50%;transform:translateY(-50%);z-index:800;
  display:flex;flex-direction:column;gap:1rem;opacity:0;pointer-events:none;transition:opacity .5s}
.journey-dots.is-on{opacity:1;pointer-events:auto}
.jdot{display:flex;align-items:center;gap:.7rem;padding:.2rem}
.jdot i{width:7px;height:7px;border:1px solid rgba(255,255,255,.7);transform:rotate(45deg);transition:background .4s,transform .4s;flex:none}
.jdot span{text-transform:uppercase;font-size:.56rem;letter-spacing:.26em;color:var(--fog-70);
  opacity:0;transform:translateX(-6px);transition:opacity .35s,transform .35s;white-space:nowrap}
.jdot:hover span,.jdot.is-on span{opacity:1;transform:none}
.jdot.is-on i{background:#fff;transform:rotate(45deg) scale(1.2)}
@media(max-width:640px){.journey-dots .jdot span{display:none}}

/* ---------- hero ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;position:relative;padding:0 var(--gutter);overflow:hidden;perspective:1100px}
.hero-visual{position:absolute;inset:-4% -2%;z-index:0;will-change:transform;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 78%,transparent 100%);
  mask-image:linear-gradient(to bottom,#000 0,#000 78%,transparent 100%)}
.hero-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8) contrast(1.06);animation:heroDrift 36s var(--ease) infinite alternate}
.hero-visual::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,42,56,.30),rgba(28,42,56,.08) 42%,rgba(16,28,40,.82)),radial-gradient(120% 78% at 50% 4%,rgba(120,150,175,.22),transparent 62%);mix-blend-mode:multiply;pointer-events:none}
@keyframes heroDrift{from{transform:scale(1.05) translate3d(0,0,0)}to{transform:scale(1.13) translate3d(-1.4%,-1.1%,0)}}
.hlayer{position:absolute;left:-4%;right:-4%;bottom:-2%;width:108%;height:auto;will-change:transform}
.hlayer img{width:100%;height:auto;display:block}
.hcloud{position:absolute;will-change:transform;pointer-events:none}
.hero-inner{position:relative;z-index:2;padding-top:clamp(4.5rem,9vh,6.5rem)}
.hero-stack{display:flex;flex-direction:column;gap:.1em}
.hero-stack .hs-line{text-transform:uppercase;font-weight:200;color:#fff;
  font-size:clamp(2.2rem,6.6vw,5.6rem);letter-spacing:.14em;line-height:1.16;
  text-shadow:0 2px 34px rgba(15,28,38,.55)}
.hero-stack .hs-line.dim{color:rgba(255,255,255,.55)}
.hero-line{margin-top:2.2rem;max-width:34ch;color:var(--fog-70);font-weight:300;
  font-size:clamp(1rem,1.4vw,1.25rem);line-height:1.9;letter-spacing:.04em;
  text-shadow:0 1px 18px rgba(15,28,38,.5)}
.skip-intro{position:absolute;right:var(--gutter);bottom:clamp(1.6rem,5vh,3rem);z-index:3;
  text-transform:uppercase;font-size:.6rem;letter-spacing:.3em;color:var(--fog-70);
  border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.6rem 1.2rem;transition:background .4s,color .4s}
.skip-intro:hover{background:rgba(255,255,255,.9);color:var(--steel)}

/* ---------- chapters ---------- */
/* breath: pure-atmosphere pause between chapters - gives the descent pacing
   and room for the cloud gates to perform */
.breath{height:52svh;pointer-events:none}
@media(max-width:640px){.breath{height:34svh}}
.panel{position:relative;padding:clamp(7rem,16vh,11rem) var(--gutter)}
.chapter{min-height:100svh;display:flex;flex-direction:column;justify-content:center}
.panel-head{display:flex;align-items:flex-start;gap:clamp(1.4rem,3vw,2.6rem);margin-bottom:2.2rem}
.panel-head .ph-text{padding-top:.4rem}
.ch-label{margin:0 0 1.2rem;font-size:.78rem;letter-spacing:.3em;color:var(--fog-70);font-weight:400;text-transform:uppercase}
.chapter p.body{margin-top:1.8rem}
.chapter .cta-circle{margin-top:2.8rem}
.ch-inner{max-width:860px;position:relative;z-index:2;padding:clamp(1.2rem,3vw,2.4rem)}
.ch-inner::before{content:"";position:absolute;inset:-8%;z-index:-1;border-radius:24px;
  background:radial-gradient(60% 60% at 30% 40%,rgba(14,24,32,.45),transparent 75%);filter:blur(6px)}
/* cinematic real-photo scene backgrounds */
.chapter.has-photo{overflow:hidden}
.chapter.has-photo .silhouette,.chapter.has-photo .plane-wrap{display:none}
.scene-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 20vh,#000 calc(100% - 20vh),transparent 100%),
                     linear-gradient(to right,transparent 0,#000 6vw,#000 calc(100% - 6vw),transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,transparent 0,#000 20vh,#000 calc(100% - 20vh),transparent 100%),
             linear-gradient(to right,transparent 0,#000 6vw,#000 calc(100% - 6vw),transparent 100%);
  mask-composite:intersect}
.scene-bg img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;will-change:transform}
.scene-bg::after{content:"";position:absolute;inset:0;pointer-events:none}
.scene-bg[data-grade="warm"] img{filter:brightness(.68) contrast(1.06) saturate(1.08) sepia(.12)}
.scene-bg[data-grade="warm"]::after{background:linear-gradient(180deg,rgba(46,30,14,.42),rgba(34,22,12,.12) 42%,rgba(14,12,20,.82)),radial-gradient(120% 82% at 50% 8%,rgba(224,158,74,.22),transparent 60%);mix-blend-mode:multiply}
.scene-bg[data-grade="dawn"] img{filter:brightness(.72) contrast(1.05) saturate(1.04)}
.scene-bg[data-grade="dawn"]::after{background:linear-gradient(180deg,rgba(52,40,28,.4),rgba(40,30,22,.12) 44%,rgba(16,14,22,.8)),radial-gradient(120% 82% at 50% 12%,rgba(236,190,120,.2),transparent 60%);mix-blend-mode:multiply}
.scene-bg[data-grade="sky"] img{filter:brightness(.84) contrast(1.03) saturate(1.02)}
.scene-bg[data-grade="sky"]::after{background:linear-gradient(180deg,rgba(120,150,180,.28),rgba(150,175,200,.06) 40%,rgba(30,42,58,.72));mix-blend-mode:multiply}
.scene-bg[data-grade="dusk"] img{filter:brightness(.6) contrast(1.09) saturate(1.12)}
.scene-bg[data-grade="dusk"]::after{background:linear-gradient(180deg,rgba(34,28,58,.46),rgba(26,24,48,.14) 40%,rgba(10,10,24,.86)),radial-gradient(120% 80% at 50% 92%,rgba(130,96,190,.28),transparent 62%);mix-blend-mode:multiply}
.globe-stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(58% 54% at 50% 46%,rgba(191,214,230,.22),transparent 62%);mix-blend-mode:screen}
.chapter.align-right .ch-inner{margin-left:auto}
.silhouette{position:absolute;left:0;right:0;bottom:0;pointer-events:none;z-index:1;display:flex;justify-content:center;overflow:hidden}
.silhouette svg{width:100%;height:auto;min-width:900px}
.sil-dark{fill:#232e36;opacity:.92}
.sil-mid{fill:#33424d;opacity:.85}
.sil-soft{fill:rgba(255,255,255,.14)}
.sil-line{stroke:rgba(255,255,255,.5);fill:none;stroke-width:1.2}
.sil-glow{fill:rgba(255,240,200,.85)}
.stupa-eye{fill:#1c262d}
.flagline{stroke:rgba(255,255,255,.55);stroke-width:1;fill:none}
.flag{opacity:.85}
.flag.f1{fill:#4a7dbb}.flag.f2{fill:#f4f4f4}.flag.f3{fill:#d95b43}.flag.f4{fill:#5a9e6f}.flag.f5{fill:#e2b93b}
/* ---------- story beats: passages placed in the scene ---------- */
.beat{position:relative;z-index:2;max-width:1100px;display:flex;flex-direction:column;gap:clamp(2.5rem,8vh,5rem)}
.beat-low{justify-content:flex-end;min-height:70svh}
.passage-lead{text-transform:uppercase;font-weight:300;color:var(--fog);letter-spacing:.1em;
  line-height:1.28;font-size:clamp(1.7rem,4.2vw,3.4rem);max-width:18ch;
  text-shadow:0 1px 26px rgba(15,25,35,.5)}
.passage{max-width:36ch;color:var(--fog-70);font-weight:300;line-height:2;letter-spacing:.03em;
  font-size:clamp(.95rem,1.2vw,1.15rem);text-shadow:0 1px 14px rgba(15,25,35,.55)}
.passage.p-right{align-self:flex-end;text-align:left}
.passage.p-left{align-self:flex-start}

/* ---------- the flight: pinned horizontal pan ---------- */
.pan-stage{min-height:100svh;display:flex;align-items:center;overflow:hidden;padding:0}
.pan-track{display:flex;align-items:center;gap:clamp(3rem,9vw,9rem);padding:0 14vw;will-change:transform}
.pan-item{flex:0 0 auto}
.pan-track .passage-lead{max-width:14ch}
.pan-photo{width:min(74vw,980px);margin:0}
.pan-photo img{width:100%;height:min(62svh,640px);object-fit:cover;
  box-shadow:0 30px 90px rgba(8,16,24,.45)}
@media(max-width:767px){
  .pan-stage{min-height:0;padding:clamp(7rem,16vh,11rem) var(--gutter)}
  .pan-track{flex-direction:column;align-items:flex-start;padding:0;gap:2.5rem}
  .pan-photo{width:100%}
  .pan-photo img{height:auto}
}

/* stupa zoom beat: lead line sits low while the photo pulls back */
.beat-zoom{min-height:82svh;justify-content:flex-end}

.win{fill:rgba(255,224,150,.9);animation:blink 4s infinite}
.win:nth-of-type(3n){animation-delay:1.3s}
.win:nth-of-type(4n){animation-delay:2.2s}
@keyframes blink{0%,92%,100%{opacity:.9}95%{opacity:.15}}

/* ---------- globe ---------- */
.globe-stage{position:relative;height:100svh}
.globe-canvas{position:absolute;inset:0;width:100%;height:100%}
.globe-overlay{position:absolute;inset:0;pointer-events:none}
.geo-label{position:absolute;display:flex;align-items:center;gap:.7rem;transform:translate(-50%,-50%);
  text-transform:uppercase;font-size:.68rem;letter-spacing:.3em;font-weight:400;color:#fff;opacity:0;white-space:nowrap;
  text-shadow:0 1px 12px rgba(0,0,0,.6)}
.geo-label i{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.9);flex:none}

  text-transform:uppercase;font-size:.62rem;letter-spacing:.3em;color:var(--fog-50)}

/* ---------- footer ---------- */
.site-footer{position:relative;z-index:3;background:#fff;color:var(--steel);padding:clamp(4.5rem,10vh,7.5rem) var(--gutter) 3rem}

/* scene sampling (shared by shader, gradient fallback, particles) */
var sceneTrack=[];

  var vh=innerHeight;
  sceneTrack=CONFIG.sceneMap.map(function(m){
    var y=m.y||0;
    if(m.sel){var elx=$(m.sel);
      if(elx){var top=docTop(elx);
        y=(m.at==="bottom"?top+elx.offsetHeight:top)+(m.ofsVh||0)*vh;}}
    return {y:y,s:CONFIG.scenes[m.scene]};

  if(!sceneTrack.length)return CONFIG.scenes.himalaya;
  if(y<=sceneTrack[0].y)return sceneTrack[0].s;
  for(var i=0;i<sceneTrack.length-1;i++){
    var a=sceneTrack[i],b=sceneTrack[i+1];
    if(y>=a.y&&y<b.y){

      var out={sky:lerp3(a.s.sky,b.s.sky,t),deep:lerp3(a.s.deep,b.s.deep,t),hi:lerp3(a.s.hi,b.s.hi,t)};
      SKEYS.forEach(function(k){out[k]=lerp(a.s[k]||0,b.s[k]||0,t);});

/* ---------- particles (snow / dust) ---------- */
(function particles(){
  var cv=$("#dust");var ctx=cv.getContext("2d");var W,H,parts=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  size();window.addEventListener("resize",size);
  var count=isLite?60:150;
  /* z = depth (0 far … 1 near): near flakes are bigger, fall faster,
     and swing more with the cursor - parallax inside the snowfall */
  for(var i=0;i<count;i++){var z=Math.random();
    parts.push({x:Math.random(),y:Math.random(),z:z,r:.5+z*2.6,

      ctx.clearRect(0,0,W,H);

          if(p.y>1.02){p.y=-.02;p.x=Math.random();}

    tabsWrap.appendChild(b);
  });
  loadBtn.addEventListener("click",function(){render(false);});
  render(true);

  var lb=$("#lightbox"),lbImg=$("#lbImg"),cur=0,lastFocus=null,touchX=null;
  function show(i,dirn){
    cur=(i+filtered.length)%filtered.length;
    var p=filtered[cur];
    var swap=function(){
      lbImg.src=p.src.replace(/([?&])w=\d+/,"$1w=1400");lbImg.alt=p.alt;
      lbImg.onerror=function(){lbImg.onerror=null;lbImg.src=genPlaceholder(900,600);};
      $("#lbTitle").textContent=p.caption;
      $("#lbLoc").textContent=p.location+", "+p.date;
      $("#lbCount").textContent=(cur+1)+" / "+filtered.length;
    };
    if(hasGSAP&&!reduceMotion){
      gsap.to(lbImg,{autoAlpha:0,x:dirn?dirn*-30:0,duration:.22,onComplete:function(){
        swap();gsap.fromTo(lbImg,{autoAlpha:0,x:dirn?dirn*30:0},{autoAlpha:1,x:0,duration:.35,ease:"power2.out"});
      }});
    }else swap();
  }
  function openLightbox(i){
    lastFocus=document.activeElement;
    lb.classList.add("is-open");
    document.body.style.overflow="hidden";if(lenis)lenis.stop();
    show(i,0);$("#lbClose").focus();
  }
  function closeLightbox(){
    lb.classList.remove("is-open");
    document.body.style.overflow="";if(lenis)lenis.start();
    if(lastFocus)lastFocus.focus();
  }
  window.openLightbox=openLightbox;
  $("#lbClose").addEventListener("click",closeLightbox);
  $("#lbPrev").addEventListener("click",function(){show(cur-1,-1);});
  $("#lbNext").addEventListener("click",function(){show(cur+1,1);});
  lb.addEventListener("click",function(e){if(e.target===lb)closeLightbox();});
  document.addEventListener("keydown",function(e){
    if(!lb.classList.contains("is-open"))return;
    if(e.key==="Escape")closeLightbox();
    if(e.key==="ArrowLeft")show(cur-1,-1);
    if(e.key==="ArrowRight")show(cur+1,1);
    if(e.key==="Tab"){
      var f=[$("#lbClose"),$("#lbPrev"),$("#lbNext")];
      var iF=f.indexOf(document.activeElement);
      e.preventDefault();
      var nxt=iF<0?0:(iF+(e.shiftKey?-1:1)+f.length)%f.length;
      f[nxt].focus();
    }
  });
  lb.addEventListener("touchstart",function(e){touchX=e.touches[0].clientX;},{passive:true});
  lb.addEventListener("touchend",function(e){
    if(touchX==null)return;
    var dx=e.changedTouches[0].clientX-touchX;
    if(Math.abs(dx)>50)show(cur+(dx<0?1:-1),dx<0?1:-1);
    touchX=null;
  },{passive:true});
})();

window.addEventListener("load",function(){if(hasGSAP)ScrollTrigger.refresh();});
})();
</script>
</body>
</html>
